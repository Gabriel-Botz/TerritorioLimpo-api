spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/territorio_limpo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
