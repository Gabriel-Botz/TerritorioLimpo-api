spring:
  application:
    name: territorio-limpo-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/territorio_limpo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Documentação interativa disponível apenas no perfil dev (application-dev.yml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    jwks-uri: ${SUPABASE_JWKS_URI:}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    issuer: ${SUPABASE_JWT_ISSUER:}
    admin-role-claim: ${ADMIN_ROLE_CLAIM:app_role}
    admin-role-value: ${ADMIN_ROLE_VALUE:ADMIN}
  storage:
    supabase-url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:ocorrencia-photos}
    signed-url-ttl: 10m
    connect-timeout: 2s
    read-timeout: 10s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-ip-limit: ${RATE_LIMIT_PER_IP_LIMIT:5}
    per-ip-window: ${RATE_LIMIT_PER_IP_WINDOW:1h}
    global-limit: ${RATE_LIMIT_GLOBAL_LIMIT:100}
    global-window: ${RATE_LIMIT_GLOBAL_WINDOW:1h}
    ip-header: ${RATE_LIMIT_IP_HEADER:X-Forwarded-For}
    entry-ttl: 24h
  turnstile:
    enabled: ${TURNSTILE_ENABLED:false}
    secret: ${TURNSTILE_SECRET:}
    verify-url: ${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
    connect-timeout: 2s
    read-timeout: 5s
