services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: territorio_limpo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - territorio_limpo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d territorio_limpo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  territorio_limpo_pgdata:
